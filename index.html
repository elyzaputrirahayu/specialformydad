<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday 🌌🎂</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(to top, #0f2027, #203a43, #2a5298, #1e3c72);
    font-family: 'Poppins', sans-serif;
}

/* BINTANG */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    animation: twinkle 2s infinite;
}

@keyframes twinkle {
    0%,100% { opacity: 0.2; }
    50% { opacity: 1; }
}

/* BULAN */
.moon {
    position: absolute;
    top: 60px;
    right: 100px;
    width: 80px;
    height: 80px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 30px white;
}

/* KUE */
.cake {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
}

.layer {
    width: 200px;
    height: 60px;
    background: brown;
    border-radius: 20px;
    margin: 5px auto;
}

/* LILIN */
.candle {
    width: 10px;
    height: 40px;
    background: white;
    margin: auto;
    position: relative;
    cursor: pointer;
}

.flame {
    width: 15px;
    height: 20px;
    background: yellow;
    border-radius: 50%;
    position: absolute;
    top: -20px;
    left: -2px;
    animation: flicker 0.3s infinite;
}

@keyframes flicker {
    0% { transform: scale(1);}
    50% { transform: scale(1.2);}
    100% { transform: scale(1);}
}

/* TEKS */
.title {
    text-align: center;
    margin-top: 40px;
    color: white;
}

/* CARD */
.card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 300px;
    color: white;
    transition: 0.5s;
}

.card.show {
    transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

<body>

<div class="moon"></div>

<div class="title">
    <h1> Klik Lilinnya </h1>
</div>

<div class="cake">
    <div class="candle" onclick="blowCandle()">
        <div class="flame" id="flame"></div>
    </div>
    <div class="layer"></div>
    <div class="layer"></div>
</div>

<div class="card" id="card">
    <h2>🎉 Happy Birthday 🎉</h2>
    <p>
        Semoga panjang umur, sehat selalu,  
        dan rejekinya lancar 💖✨
    </p>
</div>

<audio id="music" src="https://www.bensound.com/bensound-music/bensound-love.mp3"></audio>

<script>
// GENERATE BINTANG
for(let i=0;i<150;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    document.body.appendChild(s);
}

// KLIK LILIN
function blowCandle(){
    document.getElementById("flame").style.display="none";
    document.getElementById("card").classList.add("show");

    let music=document.getElementById("music");
    music.play();
}
</script>

</body>
</html>
