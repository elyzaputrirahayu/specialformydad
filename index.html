<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Military ✈️💌</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(to top, #1f2c2f, #3a6073, #4ca1af);
    font-family: 'Poppins', sans-serif;
}

/* VIGNETTE (biar cinematic) */
body::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.5));
    pointer-events: none;
}

/* AWAN */
.cloud {
    position: absolute;
    width: 120px;
    height: 60px;
    background: white;
    border-radius: 50px;
    opacity: 0.6;
    animation: cloudMove linear infinite;
}
@keyframes cloudMove {
    from { transform: translateX(-200px);}
    to { transform: translateX(120vw);}
}

/* PESAWAT */
.plane {
    position: absolute;
    top: 80px;
    left: -200px;
    font-size: 45px;
    animation: fly 10s linear forwards;
}
@keyframes fly {
    to { transform: translateX(130vw);}
}

/* ASAP PESAWAT */
.smoke {
    position: absolute;
    width: 10px;
    height: 10px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    animation: smoke 2s linear forwards;
}
@keyframes smoke {
    to {
        transform: translateX(-100px) translateY(-20px);
        opacity: 0;
    }
}

/* SURAT */
.letter {
    position: absolute;
    top: 120px;
    left: 50%;
    width: 90px;
    height: 60px;
    background: #ffb6c1;
    border-radius: 10px;
    text-align: center;
    line-height: 60px;
    font-size: 25px;
    cursor: pointer;
    display: none;
}

/* JATUH ZIGZAG */
@keyframes fallZigzag {
    0% { transform: translateY(0) translateX(0) rotate(0deg);}
    25% { transform: translateY(120px) translateX(-30px) rotate(-10deg);}
    50% { transform: translateY(240px) translateX(30px) rotate(10deg);}
    75% { transform: translateY(360px) translateX(-20px) rotate(-5deg);}
    100% { transform: translateY(200px) translateX(0);}
}

/* TENTARA */
.soldier {
    position: absolute;
    bottom: 0;
    font-size: 40px;
    animation: march 6s linear infinite;
}
@keyframes march {
    from { transform: translateX(-100px);}
    to { transform: translateX(120vw);}
}

/* POPUP */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.7);
    padding: 30px;
    border-radius: 20px;
    color: white;
    text-align: center;
    width: 300px;
    transition: 0.5s;
}

.popup.show {
    transform: translate(-50%, -50%) scale(1);
}

/* FLASH DRAMATIS */
.flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<!-- AWAN -->
<script>
for(let i=0;i<6;i++){
    let c=document.createElement("div");
    c.className="cloud";
    c.style.top=Math.random()*200+"px";
    c.style.animationDuration=(15+Math.random()*10)+"s";
    document.body.appendChild(c);
}
</script>

<!-- PESAWAT -->
<div class="plane" id="plane">✈️</div>

<!-- SURAT -->
<div class="letter" id="letter" onclick="openCard()">💌</div>

<!-- TENTARA -->
<div class="soldier" style="left:0">🪖</div>
<div class="soldier" style="left:120px; animation-delay:1s;">🪖</div>
<div class="soldier" style="left:240px; animation-delay:2s;">🪖</div>

<!-- POPUP -->
<div class="popup" id="popup">
    <h2>🎖️ Happy Birthday 🎖️</h2>
    <p>
        Semoga ayah selalu kuat, tangguh,  
        dan jadi kebanggaan seperti seorang pejuang 💖✨
    </p>
</div>

<div class="flash" id="flash"></div>

<script>
let plane = document.getElementById("plane");
let letter = document.getElementById("letter");

// asap pesawat
setInterval(()=>{
    let s=document.createElement("div");
    s.className="smoke";
    s.style.left=plane.offsetLeft+"px";
    s.style.top=plane.offsetTop+"px";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),2000);
},200);

// jatuhkan surat setelah pesawat lewat
setTimeout(()=>{
    letter.style.display="block";
    letter.style.animation="fallZigzag 4s ease-in forwards";
},4000);

// klik surat
function openCard(){
    document.getElementById("popup").classList.add("show");

    // flash cinematic
    let flash=document.getElementById("flash");
    flash.style.opacity="1";
    setTimeout(()=>flash.style.opacity="0",200);
}
</script>

</body>
</html>
