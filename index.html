<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday 🌳💌</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background: radial-gradient(circle at top, #1e3c72, #2a5298, #0f2027);
    font-family: 'Poppins', sans-serif;
}

/* BINTANG */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    animation: twinkle 2s infinite;
}
@keyframes twinkle {
    0%,100% { opacity: 0.2; }
    50% { opacity: 1; }
}

/* POHON */
.tree {
    position: absolute;
    bottom: 0;
    left: 10%;
}

.trunk {
    width: 30px;
    height: 150px;
    background: #5c3b1e;
    margin: auto;
}

.leaves {
    width: 150px;
    height: 120px;
    background: green;
    border-radius: 50%;
    position: relative;
    top: -50px;
}

/* KARTU */
.card {
    position: absolute;
    top: -100px;
    left: 40px;
    width: 120px;
    height: 80px;
    background: pink;
    border-radius: 10px;
    text-align: center;
    padding-top: 10px;
    cursor: pointer;
    animation: none;
}

/* ANIMASI JATUH */
@keyframes fallCard {
    to {
        transform: translateY(200px) rotate(20deg);
    }
}

/* POPUP */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    color: white;
    text-align: center;
    transition: 0.5s;
}

.popup.show {
    transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

<body>

<!-- BINTANG -->
<script>
for(let i=0;i<100;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    document.body.appendChild(s);
}
</script>

<!-- POHON -->
<div class="tree">
    <div class="leaves">
        <div class="card" id="card" onclick="openCard()">💌</div>
    </div>
    <div class="trunk"></div>
</div>

<!-- POPUP UCAPAN -->
<div class="popup" id="popup">
    <h2>🎉 Happy Birthday 🎉</h2>
    <p>
        Semoga panjang umur, sehat selalu 💖  
        dan semoga hari hari penuh kebahagiaan ✨
    </p>
</div>

<script>

// jatuhkan kartu setelah 1 detik
setTimeout(()=>{
    let c = document.getElementById("card");
    c.style.animation = "fallCard 2s forwards";
},1000);

// klik kartu → buka ucapan
function openCard(){
    document.getElementById("popup").classList.add("show");
}

</script>

</body>
</html>
